# main-guard -- the server-side half of the merge gate on a free private repo
# (GitHub only enforces branch rulesets there on paid plans).
#
# On every push to main (a merged pull request or a direct push), this runs
# the fast suites. If any fails, it AUTO-REVERTS main to the commit before the
# push (one new "Auto-revert" commit, history is kept) and opens an issue that
# names the bad commit, its author and the failing check.
#
# The client-side half is .githooks/pre-push (blocks direct pushes to main
# and runs the guard before anything leaves a laptop).
#
# A revert pushed with GITHUB_TOKEN does not trigger workflows, so this cannot loop.
name: main-guard

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: main-guard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ok: ${{ steps.reg.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - id: reg
        continue-on-error: true
        run: python3 ci/run_regression.py guards interconnect bridge link errors 2>&1 | tee regression.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: main-guard-log, path: regression.txt }

  revert:
    needs: check
    if: needs.check.outputs.ok != 'true' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Revert main to the last good commit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          git config user.name  "main-guard"
          git config user.email "main-guard@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$AFTER" ]; then
            echo "main moved since this push; not reverting automatically."; exit 1
          fi
          # Restore the whole tree of the last good commit as one new commit
          # (works for merges and multi-commit pushes alike; history is kept).
          git restore --source="$BEFORE" --staged --worktree -- :/
          git commit -m "Auto-revert ${AFTER:0:7}: regression failed on main" \
                     -m "main-guard restored main to ${BEFORE:0:7}. See the issue opened by this run. Fix on a branch, then merge again."
          git push origin HEAD:main
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "main-guard: ${AFTER:0:7} broke the regression and was reverted" \
            --body "Pushed by @${ACTOR}. Failing run and log: ${RUN}

          main was restored to the previous commit. To land the change: create a branch from the reverted commit's content, fix it, run \`python3 ci/run_regression.py\` locally, open a pull request and merge it once its checks are green."
