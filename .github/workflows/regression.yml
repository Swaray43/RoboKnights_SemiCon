# Phase 2 regression -- runs on every push and pull request.
# Simulator: Icarus Verilog 12 (Ubuntu package). ModelSim stays the local tool;
# GitHub runners have no licence for it. Same scripts run locally:
#   python3 ci/run_regression.py            (or pick suites: guards link bridge ...)
#
# Make it a merge gate: GitHub -> Settings -> Branches -> add a rule for `main`
# -> "Require status checks to pass" -> select the jobs below.
name: regression

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"        # nightly 02:00 IST: also runs the long and formal suites

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards (lost fixes, file lists, duplicate modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 ci/check_protected.py

  sim:
    name: sim / ${{ matrix.suite }}
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [link, interconnect, phy, cocotb, bridge, errors, asic, rand]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Install cocotb
        if: matrix.suite == 'cocotb'
        run: pip install cocotb==2.1.0
      - name: Run ${{ matrix.suite }}
        run: python3 ci/run_regression.py ${{ matrix.suite }}

  long:
    name: sim / long (600 TLPs)
    needs: guards
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - run: python3 ci/run_regression.py long

  rand-sweep:
    name: sim / rand sweep (nightly, 40 seeds)
    needs: guards
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        block: [100, 110, 120, 130]          # 4 runners x 10 seeds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - run: python3 ci/run_regression.py rand
        env:
          RAND_SEEDS: "10"
          RAND_BASE: ${{ matrix.block }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "cov-${{ matrix.block }}", path: ci_out/cov_*.txt }

  coverage:
    name: coverage (Step 3 C, 40 seeds merged)
    needs: rand-sweep
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { pattern: "cov-*", path: cov, merge-multiple: true }
      - run: python3 ci/coverage_report.py --strict cov/cov_*.txt

  formal:
    name: formal (SymbiYosys)
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install OSS CAD Suite (yosys, sby, solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3
      - run: python3 ci/run_regression.py formal
